name: deploy

# Every push to the deployed branch is tested, then built, pushed to the registry and rolled out to the two Container Apps.
# No password is stored in GitHub: the job proves who it is to Azure with a short-lived OIDC token (see docs/CI-CD.md).
on:
  push:
    branches: [final-project, main]
    paths-ignore: ["docs/**", "**/*.md", "processing/**"]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: false   # never stop a roll-out half way

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.AZURE_ACR_NAME }}.azurecr.io
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  API_APP: ${{ vars.AZURE_API_APP }}
  WEB_APP: ${{ vars.AZURE_WEB_APP }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests and API contract
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m pytest -q
          python scripts/export_openapi.py
          git diff --exit-code openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend type check, Darija check, build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          node lib/i18n.check.mjs
          NEXT_PUBLIC_API_URL=https://example.invalid npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production        # the Azure trust is limited to this GitHub environment
    permissions:
      id-token: write              # lets the job ask GitHub for the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC, no password)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.REGISTRY }}/farm-final-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image (the API address is part of the build)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=https://${{ vars.AZURE_API_FQDN }}
          tags: ${{ env.REGISTRY }}/farm-final-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Roll out the API, then the web app
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$API_APP" --image "$REGISTRY/farm-final-api:${{ github.sha }}" --output none
          az containerapp update -g "$RESOURCE_GROUP" -n "$WEB_APP" --image "$REGISTRY/farm-final-web:${{ github.sha }}" --output none

      - name: Check that Azure really runs this commit
        run: |
          for app in "$API_APP" "$WEB_APP"; do
            img=$(az containerapp show -g "$RESOURCE_GROUP" -n "$app" --query "properties.template.containers[0].image" -o tsv)
            echo "$app runs $img"
            case "$img" in *":${{ github.sha }}") ;; *) echo "::error::$app does not run this commit"; exit 1;; esac
          done

      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "https://${{ vars.AZURE_API_FQDN }}/api/health"
          echo
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --output /dev/null "https://${{ vars.AZURE_WEB_FQDN }}/"
          echo "Deployed ${{ github.sha }}"
